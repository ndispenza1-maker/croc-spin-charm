<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — Spinnlitz</title>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0e2e; --white: #fff0f8; --accent: #ff6eb4;
      --grey: #0d1a4a; --border: #1a2a6c; --mid: #7ab3d4;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body { background: var(--black); color: var(--white); font-family: var(--font); min-height: 100vh; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 2rem; height: 56px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--black); z-index: 10;
    }
    .logo { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; color: var(--white); opacity: 0.5; }
    .logo:hover { opacity: 1; }
    .add-more { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; color: var(--accent); opacity: 0.8; transition: opacity 0.2s; }
    .add-more:hover { opacity: 1; }

    .page { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    h1 { font-size: 1.6rem; font-weight: 300; letter-spacing: -0.01em; margin-bottom: 0.3rem; }
    .sub { font-size: 0.78rem; color: var(--mid); margin-bottom: 2rem; letter-spacing: 0.04em; }

    /* BUNDLE GROUP */
    .group { margin-bottom: 2rem; }
    .group-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.6rem 1rem; border-radius: 0;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    }
    .group-header.bundle { background: var(--accent); color: #000; }
    .group-header.single { background: #0c1235; color: var(--mid); border: 1px solid var(--border); border-bottom: none; }
    .group-price { font-size: 0.95rem; font-weight: 700; }

    .items { border: 1px solid var(--border); overflow: hidden; }
    .item {
      display: flex; align-items: center; gap: 1.25rem;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      background: var(--grey);
    }
    .item:last-child { border-bottom: none; }
    .item-img { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; background: #0c1235; }
    .item-info { flex: 1; }
    .item-name { font-size: 0.88rem; font-weight: 700; margin-bottom: 0.2rem; text-transform: capitalize; letter-spacing: 0.02em; }
    .item-color { font-size: 0.72rem; color: var(--mid); display: flex; align-items: center; gap: 0.4rem; }
    .color-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .item-price { font-size: 0.85rem; font-weight: 300; color: var(--mid); }
    .item-remove { background: none; border: none; color: #2a3a7c; font-size: 1rem; cursor: pointer; padding: 0.25rem; line-height: 1; transition: color 0.15s; }
    .item-remove:hover { color: var(--accent); }

    /* BUNDLE SLOT (empty) */
    .slot {
      display: flex; align-items: center; gap: 1.25rem;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      background: #090909; opacity: 0.5;
    }
    .slot:last-child { border-bottom: none; }
    .slot-circle { width: 52px; height: 52px; border-radius: 50%; border: 1px dashed #1a2a6c; flex-shrink: 0; }
    .slot-text { font-size: 0.78rem; color: var(--mid); letter-spacing: 0.04em; }

    /* SUMMARY */
    .summary {
      background: var(--grey); border: 1px solid var(--border);
      padding: 1.5rem; margin-top: 1rem;
    }
    .summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.6rem; }
    .summary-row.total { font-size: 1rem; font-weight: 700; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); margin-bottom: 0; }
    .summary-row .label { color: var(--mid); }
    .free { color: #6dbf8a; font-weight: 700; }
    .shipping-bar { margin: 0.75rem 0 1.25rem; }
    .shipping-bar-track { background: #1a2a6c; border-radius: 99px; height: 2px; margin-top: 0.4rem; }
    .shipping-bar-fill { background: var(--accent); border-radius: 99px; height: 2px; transition: width 0.3s; }
    .shipping-hint { font-size: 0.68rem; color: var(--mid); margin-top: 0.3rem; letter-spacing: 0.06em; }

    .btn-checkout {
      display: block; width: 100%; background: transparent; color: var(--white);
      padding: 1rem; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.15); cursor: pointer; margin-top: 1.25rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-checkout:hover { border-color: var(--accent); color: var(--accent); }
    .btn-checkout:disabled { opacity: 0.3; cursor: default; }

    /* EMPTY */
    .empty { text-align: center; padding: 5rem 2rem; }
    .empty h2 { font-size: 1.4rem; font-weight: 300; margin-bottom: 0.75rem; }
    .empty p { color: var(--mid); margin-bottom: 2rem; font-size: 0.88rem; }
    .btn-design {
      display: inline-block; background: transparent; color: var(--white);
      padding: 0.85rem 2rem; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.15); text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-design:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">← Spinnlitz</a>
  <a class="add-more" href="/studio.html">+ Add More</a>
</nav>

<div class="page">
  <div id="empty" class="empty" style="display:none">
    <h2>Your cart is empty.</h2>
    <p>Head to the studio and design your first charm.</p>
    <a class="btn-design" href="/studio.html">Start Designing</a>
  </div>

  <div id="cart-content" style="display:none">
    <h1>Your Cart</h1>
    <p class="sub">Discs $1.99 each &nbsp;·&nbsp; 5-pack $9.99 &nbsp;·&nbsp; Bases $3.99 each</p>
    <div id="groups"></div>

    <div class="summary">
      <div class="shipping-bar">
        <div class="summary-row" style="margin-bottom:0.2rem">
          <span class="label" id="shipping-label">Add more to unlock free shipping</span>
          <span id="shipping-cost">—</span>
        </div>
        <div class="shipping-bar-track">
          <div class="shipping-bar-fill" id="shipping-fill" style="width:0%"></div>
        </div>
        <div class="shipping-hint">Free shipping over $25</div>
      </div>
      <div class="summary-row"><span class="label">Subtotal</span><span id="subtotal">$0.00</span></div>
      <div class="summary-row"><span class="label">Shipping</span><span id="shipping-line">—</span></div>
      <div class="summary-row total"><span>Total</span><span id="total">$0.00</span></div>
      <button class="btn-checkout" id="checkout-btn">Checkout</button>
    </div>
  </div>
</div>

<script>
const SHIPPING = 4.99;
const FREE_THRESHOLD = 25;
const DISC_PRICE = 1.99;
const DISC_5PACK_PRICE = 9.99;
const BASE_PRICE = 3.99;

const COLOR_NAMES = {
  '#f5f5f5':'White','#1a1aff':'Blue','#ff4d00':'Orange',
  '#00cc44':'Green','#ffcc00':'Yellow','#cc00cc':'Purple',
  '#ff1a4b':'Red','#111111':'Black'
};

function getCart() { return JSON.parse(localStorage.getItem('spinnlitz-cart') || '[]'); }
function saveCart(c) { localStorage.setItem('spinnlitz-cart', JSON.stringify(c)); }

function removeItem(id) {
  saveCart(getCart().filter(i => i.id !== id));
  renderCart();
}

function renderCart() {
  const cart = getCart();
  if (cart.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('cart-content').style.display = 'none';
    return;
  }
  document.getElementById('empty').style.display = 'none';
  document.getElementById('cart-content').style.display = 'block';

  const discs = cart.filter(i => i.type === 'disc' || !i.type);
  const bases = cart.filter(i => i.type === 'base');
  const customs = cart.filter(i => i.type === 'custom');

  let subtotal = 0;
  const groupsEl = document.getElementById('groups');
  groupsEl.innerHTML = '';

  // --- DISCS: group into 5-packs then remainder ---
  if (discs.length > 0) {
    for (let i = 0; i < discs.length; i += 5) {
      const chunk = discs.slice(i, i + 5);
      const is5pack = chunk.length === 5;
      const groupPrice = is5pack ? DISC_5PACK_PRICE : chunk.length * DISC_PRICE;
      subtotal += groupPrice;

      const groupDiv = document.createElement('div');
      groupDiv.className = 'group';

      const header = document.createElement('div');
      header.className = 'group-header ' + (is5pack ? 'bundle' : 'single');
      header.innerHTML = is5pack
        ? `<span>5-Pack — Save 40%</span><span class="group-price">$${DISC_5PACK_PRICE.toFixed(2)}</span>`
        : `<span>Spinner Disc${chunk.length > 1 ? 's' : ''}</span><span class="group-price">$${groupPrice.toFixed(2)}</span>`;
      groupDiv.appendChild(header);

      const itemsDiv = document.createElement('div');
      itemsDiv.className = 'items';

      chunk.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `
          <img class="item-img" src="${item.preview}" alt="${item.shape}" />
          <div class="item-info">
            <div class="item-name">${item.shape.replace(/-/g,' ')}</div>
            <div class="item-color">
              <span class="color-dot" style="background:${item.color}"></span>
              ${COLOR_NAMES[item.color] || item.color}
            </div>
          </div>
          <span class="item-price">${is5pack ? '—' : '$' + DISC_PRICE.toFixed(2)}</span>
          <button class="item-remove" data-id="${item.id}" title="Remove">✕</button>`;
        itemsDiv.appendChild(row);
      });

      if (!is5pack) {
        const needed = 5 - chunk.length;
        for (let s = 0; s < needed; s++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.innerHTML = `<div class="slot-circle"></div><span class="slot-text">Add ${needed - s} more disc${needed - s > 1 ? 's' : ''} for $9.99 5-pack</span>`;
          itemsDiv.appendChild(slot);
        }
      }

      groupDiv.appendChild(itemsDiv);
      groupsEl.appendChild(groupDiv);
    }
  }

  // --- BASES ---
  if (bases.length > 0) {
    const basePrice = bases.length * BASE_PRICE;
    subtotal += basePrice;

    const groupDiv = document.createElement('div');
    groupDiv.className = 'group';

    const header = document.createElement('div');
    header.className = 'group-header single';
    header.innerHTML = `<span>Housing Base${bases.length > 1 ? 's' : ''}</span><span class="group-price">$${basePrice.toFixed(2)}</span>`;
    groupDiv.appendChild(header);

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'items';

    bases.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <div class="item-img" style="display:flex;align-items:center;justify-content:center;font-size:1.4rem">⚪</div>
        <div class="item-info">
          <div class="item-name">Housing Base</div>
          <div class="item-color">Fits any standard shoe hole</div>
        </div>
        <span class="item-price">$${BASE_PRICE.toFixed(2)}</span>
        <button class="item-remove" data-id="${item.id}" title="Remove">✕</button>`;
      itemsDiv.appendChild(row);
    });

    groupDiv.appendChild(itemsDiv);
    groupsEl.appendChild(groupDiv);
  }

  // --- CUSTOM UPLOADED SHAPES ---
  if (customs.length > 0) {
    customs.forEach(item => {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'group';

      const header = document.createElement('div');
      header.className = 'group-header single';
      header.innerHTML = `<span>Custom Shape</span><span class="group-price">$9.99</span>`;
      groupDiv.appendChild(header);
      subtotal += 9.99;

      const itemsDiv = document.createElement('div');
      itemsDiv.className = 'items';
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <img class="item-img" src="${item.preview}" alt="${item.shape}" />
        <div class="item-info">
          <div class="item-name">${item.shape.replace(/-/g,' ')}</div>
          <div class="item-color">
            <span class="color-dot" style="background:${item.color}"></span>
            Custom silhouette
          </div>
        </div>
        <span class="item-price">$9.99</span>
        <button class="item-remove" data-id="${item.id}" title="Remove">✕</button>`;
      itemsDiv.appendChild(row);
      groupDiv.appendChild(itemsDiv);
      groupsEl.appendChild(groupDiv);
    });
  }

  // Remove buttons
  document.querySelectorAll('.item-remove').forEach(btn => {
    btn.addEventListener('click', () => removeItem(Number(btn.dataset.id)));
  });

  // Shipping
  const shippingFree = subtotal >= FREE_THRESHOLD;
  const shippingCost = shippingFree ? 0 : SHIPPING;
  const total = subtotal + shippingCost;
  const pct = Math.min(100, (subtotal / FREE_THRESHOLD) * 100);

  document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
  document.getElementById('shipping-fill').style.width = pct + '%';

  if (shippingFree) {
    document.getElementById('shipping-label').textContent = 'Free shipping unlocked!';
    document.getElementById('shipping-cost').textContent = '';
    document.getElementById('shipping-line').innerHTML = '<span class="free">FREE</span>';
  } else {
    const left = (FREE_THRESHOLD - subtotal).toFixed(2);
    document.getElementById('shipping-label').textContent = `$${left} away from free shipping`;
    document.getElementById('shipping-cost').textContent = '';
    document.getElementById('shipping-line').textContent = '$' + SHIPPING.toFixed(2);
  }

  document.getElementById('total').textContent = '$' + total.toFixed(2);
}

document.getElementById('checkout-btn').addEventListener('click', () => {
  alert('Stripe checkout coming soon!');
});

renderCart();
</script>
</body>
</html>
