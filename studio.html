<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Your Charm — Croc Spin Charm</title>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a;
      --white: #f5f5f5;
      --accent: #ff4d00;
      --grey: #1a1a1a;
      --border: #222;
      --mid: #666;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body { background: var(--black); color: var(--white); font-family: var(--font); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 2rem; height: 56px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--white); opacity: 0.6; }
    .logo:hover { opacity: 1; }

    .studio { display: grid; grid-template-columns: 1fr 340px; flex: 1; overflow: hidden; }

    /* PREVIEW */
    .preview {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #080808; border-right: 1px solid var(--border);
      gap: 1.25rem;
    }
    .preview-label { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mid); }
    #disc { display: block; }

    /* PANEL */
    .panel { display: flex; flex-direction: column; overflow-y: auto; }

    .section { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
    .section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mid); margin-bottom: 0.75rem; }

    /* SHAPE GRID */
    .shape-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
    .shape-tile {
      background: var(--grey); border: 1.5px solid transparent; border-radius: 3px;
      padding: 0.6rem 0.25rem; cursor: pointer; text-align: center;
      transition: border-color 0.12s, background 0.12s;
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
    }
    .shape-tile:hover { border-color: #444; }
    .shape-tile.active { border-color: var(--accent); background: #1f0d00; }
    .shape-glyph { font-size: 1.3rem; line-height: 1; }
    .shape-name { font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); }
    .shape-tile.active .shape-name { color: var(--accent); }

    /* COLORS */
    .color-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2.5px solid transparent; cursor: pointer;
      transition: border-color 0.12s;
    }
    .swatch.active { border-color: var(--white); }

    /* TEXT */
    .text-input {
      width: 100%; background: var(--grey); border: 1.5px solid var(--border);
      border-radius: 3px; color: var(--white); font-family: var(--font);
      font-size: 0.95rem; padding: 0.65rem 0.85rem; outline: none;
      transition: border-color 0.12s;
    }
    .text-input:focus { border-color: var(--accent); }
    .hint { font-size: 0.7rem; color: var(--mid); margin-top: 0.35rem; }

    /* BUY */
    .buy { padding: 1.25rem 1.5rem; margin-top: auto; }
    .buy-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.85rem; }
    .buy-label { font-size: 0.8rem; color: var(--mid); }
    .buy-price { font-size: 1.6rem; font-weight: 900; }
    .btn-buy {
      display: block; width: 100%; background: var(--accent); color: #fff;
      padding: 0.9rem; font-size: 0.9rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer;
    }
    .btn-buy:hover { opacity: 0.88; }
    .shipping { font-size: 0.68rem; color: var(--mid); text-align: center; margin-top: 0.5rem; }

    @media (max-width: 680px) {
      body { overflow: auto; }
      .studio { grid-template-columns: 1fr; height: auto; }
      .preview { padding: 2.5rem 1rem; border-right: none; border-bottom: 1px solid var(--border); }
      .buy { margin-top: 0; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">← Croc Spin Charm</a>
</nav>

<div class="studio">

  <div class="preview">
    <div class="preview-label">Live Preview</div>
    <canvas id="disc" width="260" height="260"></canvas>
  </div>

  <div class="panel">

    <div class="section">
      <div class="section-label">Shape</div>
      <div class="shape-grid" id="shape-grid"></div>
    </div>

    <div class="section">
      <div class="section-label">Color</div>
      <div class="color-row" id="color-row"></div>
    </div>

    <div class="section">
      <div class="section-label">Text — optional</div>
      <input class="text-input" id="txt" type="text" maxlength="10" placeholder="e.g. BESTIE, 2025, ♥" />
      <div class="hint">10 characters max</div>
    </div>

    <div class="buy">
      <div class="buy-row">
        <span class="buy-label">Custom spinner charm</span>
        <span class="buy-price">$4.99</span>
      </div>
      <button class="btn-buy" id="buy-btn">Add to Cart</button>
      <div class="shipping">+ shipping &nbsp;·&nbsp; Free over $25</div>
    </div>

  </div>
</div>

<script>
// ── SHAPES ────────────────────────────────────────────────────────
const SHAPES = [
  { id: 'star',      glyph: '★', label: 'Star',      draw: drawStar      },
  { id: 'heart',     glyph: '♥', label: 'Heart',     draw: drawHeart     },
  { id: 'lightning', glyph: '⚡', label: 'Lightning', draw: drawLightning },
  { id: 'moon',      glyph: '☽', label: 'Moon',      draw: drawMoon      },
  { id: 'diamond',   glyph: '◆', label: 'Diamond',   draw: drawDiamond   },
  { id: 'crown',     glyph: '♛', label: 'Crown',     draw: drawCrown     },
  { id: 'shield',    glyph: '⛨', label: 'Shield',    draw: drawShield    },
  { id: 'flame',     glyph: '🔥', label: 'Flame',     draw: drawFlame     },
  { id: 'peace',     glyph: '☮', label: 'Peace',     draw: drawPeace     },
  { id: 'paw',       glyph: '🐾', label: 'Paw',       draw: drawPaw       },
  { id: 'flower',    glyph: '✿', label: 'Flower',    draw: drawFlower    },
  { id: 'wave',      glyph: '〜', label: 'Wave',      draw: drawWave      },
];

const COLORS = [
  { hex: '#f5f5f5', name: 'White'  },
  { hex: '#1a1aff', name: 'Blue'   },
  { hex: '#ff4d00', name: 'Orange' },
  { hex: '#00cc44', name: 'Green'  },
  { hex: '#ffcc00', name: 'Yellow' },
  { hex: '#cc00cc', name: 'Purple' },
  { hex: '#ff1a4b', name: 'Red'    },
  { hex: '#111111', name: 'Black'  },
];

// ── STATE ─────────────────────────────────────────────────────────
let activeShape = SHAPES[0];
let activeColor = COLORS[0].hex;
let discText    = '';
let angle       = 0;

// ── CANVAS ───────────────────────────────────────────────────────
const canvas = document.getElementById('disc');
const ctx    = canvas.getContext('2d');
const C      = 130; // center
const R      = 108; // shape radius

function isLight(hex) {
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114)/1000 > 140;
}

function render() {
  ctx.clearRect(0, 0, 260, 260);
  ctx.save();
  ctx.translate(C, C);
  ctx.rotate(angle);

  ctx.fillStyle = activeColor;
  activeShape.draw(ctx, R);

  if (discText) {
    const fg = isLight(activeColor) ? '#111' : '#fff';
    const fs = discText.length > 7 ? 16 : discText.length > 4 ? 20 : 26;
    ctx.font = `900 ${fs}px 'Helvetica Neue', Helvetica, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = fg;
    ctx.fillText(discText.toUpperCase(), 0, 0);
  }

  ctx.restore();
  angle += 0.016;
  requestAnimationFrame(render);
}
render();

// ── SHAPE DRAW FUNCTIONS ──────────────────────────────────────────
function drawStar(ctx, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.42;
    const a   = (i * Math.PI / 5) - Math.PI / 2;
    i === 0 ? ctx.moveTo(rad*Math.cos(a), rad*Math.sin(a))
            : ctx.lineTo(rad*Math.cos(a), rad*Math.sin(a));
  }
  ctx.closePath(); ctx.fill();
}

function drawHeart(ctx, r) {
  const s = r / 70;
  ctx.save(); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.bezierCurveTo(-70, -80, -110,  15, 0,  75);
  ctx.bezierCurveTo( 110,  15,  70, -80, 0, -10);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawLightning(ctx, r) {
  const w = r * 0.45, h = r;
  ctx.beginPath();
  ctx.moveTo( w * 0.3, -h);
  ctx.lineTo(-w * 0.5,  h * 0.05);
  ctx.lineTo( w * 0.15, h * 0.05);
  ctx.lineTo(-w * 0.3,  h);
  ctx.lineTo( w * 0.5, -h * 0.05);
  ctx.lineTo(-w * 0.15,-h * 0.05);
  ctx.closePath(); ctx.fill();
}

function drawMoon(ctx, r) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.arc(r * 0.32, -r * 0.08, r * 0.76, 0, Math.PI * 2, true);
  ctx.fill('evenodd');
  ctx.restore();
}

function drawDiamond(ctx, r) {
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r * 0.65,  0);
  ctx.lineTo(0,  r);
  ctx.lineTo(-r * 0.65, 0);
  ctx.closePath(); ctx.fill();
}

function drawCrown(ctx, r) {
  const by = r * 0.45, ty = -r * 0.2;
  ctx.beginPath();
  ctx.moveTo(-r * 0.85, by);
  ctx.lineTo(-r * 0.85, ty);
  ctx.lineTo(-r * 0.45, ty + r * 0.5);
  ctx.lineTo(0,          ty - r * 0.3);
  ctx.lineTo( r * 0.45, ty + r * 0.5);
  ctx.lineTo( r * 0.85, ty);
  ctx.lineTo( r * 0.85, by);
  ctx.closePath(); ctx.fill();
  // base band
  ctx.fillRect(-r * 0.85, by, r * 1.7, r * 0.25);
}

function drawShield(ctx, r) {
  ctx.beginPath();
  ctx.moveTo(0, r * 0.95);
  ctx.bezierCurveTo(-r*0.55, r*0.5, -r*0.95, r*0.1, -r*0.95, -r*0.4);
  ctx.lineTo(-r * 0.95, -r * 0.7);
  ctx.bezierCurveTo(-r*0.95, -r*0.95, -r*0.65, -r*0.95, 0, -r*0.95);
  ctx.bezierCurveTo( r*0.65, -r*0.95,  r*0.95, -r*0.95, r*0.95, -r*0.7);
  ctx.lineTo(r * 0.95, -r * 0.4);
  ctx.bezierCurveTo(r*0.95, r*0.1, r*0.55, r*0.5, 0, r*0.95);
  ctx.closePath(); ctx.fill();
}

function drawFlame(ctx, r) {
  ctx.beginPath();
  ctx.moveTo(0, r);
  ctx.bezierCurveTo(-r*0.55, r*0.4, -r*0.65, -r*0.1, -r*0.2, -r*0.45);
  ctx.bezierCurveTo(-r*0.3,  -r*0.65, -r*0.1, -r*0.85, 0, -r);
  ctx.bezierCurveTo( r*0.1,  -r*0.85,  r*0.3, -r*0.65,  r*0.2, -r*0.45);
  ctx.bezierCurveTo( r*0.65, -r*0.1,   r*0.55, r*0.4, 0, r);
  ctx.closePath(); ctx.fill();
}

function drawPeace(ctx, r) {
  const fg = isLight(activeColor) ? '#111' : '#fff'; // not needed here, caller sets fillStyle
  ctx.save();
  ctx.lineWidth = r * 0.12;
  ctx.strokeStyle = activeColor;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(0, r);
  ctx.moveTo(0, 0);  ctx.lineTo(-r * Math.cos(Math.PI/6), r * Math.sin(Math.PI/6));
  ctx.moveTo(0, 0);  ctx.lineTo( r * Math.cos(Math.PI/6), r * Math.sin(Math.PI/6));
  ctx.stroke();
  ctx.restore();
}

function drawPaw(ctx, r) {
  ctx.beginPath(); ctx.arc(0, r*0.18, r*0.52, 0, Math.PI*2); ctx.fill();
  [[-r*0.52,-r*0.28],[-r*0.18,-r*0.6],[r*0.18,-r*0.6],[r*0.52,-r*0.28]].forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(x, y, r*0.22, 0, Math.PI*2); ctx.fill();
  });
}

function drawFlower(ctx, r) {
  const petals = 6, pr = r*0.42, cr = r*0.28;
  for (let i = 0; i < petals; i++) {
    const a = (i/petals) * Math.PI*2;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*(r-pr), Math.sin(a)*(r-pr), pr, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, cr, 0, Math.PI*2); ctx.fill();
}

function drawWave(ctx, r) {
  ctx.save();
  ctx.lineWidth = r * 0.14;
  ctx.lineCap = 'round';
  ctx.strokeStyle = activeColor;
  [-r*0.28, r*0.28].forEach(oy => {
    ctx.beginPath();
    ctx.moveTo(-r, oy);
    ctx.bezierCurveTo(-r*0.5, oy - r*0.45, -r*0.1, oy + r*0.45,  r*0.3, oy);
    ctx.bezierCurveTo( r*0.6, oy - r*0.35,  r*0.85, oy + r*0.3,  r,     oy);
    ctx.stroke();
  });
  ctx.restore();
}

// ── BUILD UI ──────────────────────────────────────────────────────
const shapeGrid = document.getElementById('shape-grid');
SHAPES.forEach(s => {
  const tile = document.createElement('div');
  tile.className = 'shape-tile' + (s.id === activeShape.id ? ' active' : '');
  tile.innerHTML = `<span class="shape-glyph">${s.glyph}</span><span class="shape-name">${s.label}</span>`;
  tile.addEventListener('click', () => {
    document.querySelectorAll('.shape-tile').forEach(t => t.classList.remove('active'));
    tile.classList.add('active');
    activeShape = s;
  });
  shapeGrid.appendChild(tile);
});

const colorRow = document.getElementById('color-row');
COLORS.forEach((c, i) => {
  const sw = document.createElement('div');
  sw.className = 'swatch' + (i === 0 ? ' active' : '');
  sw.style.background = c.hex;
  sw.title = c.name;
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    activeColor = c.hex;
  });
  colorRow.appendChild(sw);
});

document.getElementById('txt').addEventListener('input', e => { discText = e.target.value; });

document.getElementById('buy-btn').addEventListener('click', () => {
  // Stripe checkout wires in here
  alert('Checkout coming soon!');
});
</script>
</body>
</html>
