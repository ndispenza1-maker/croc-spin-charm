<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Your Charm — Croc Spin Charm</title>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a;
      --white: #f5f5f5;
      --accent: #ff4d00;
      --grey: #1a1a1a;
      --mid: #888;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body { background: var(--black); color: var(--white); font-family: var(--font); min-height: 100vh; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 2rem; border-bottom: 1px solid #222;
      background: var(--black); position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 1rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--white); }
    .price-tag { font-size: 1.2rem; font-weight: 900; color: var(--accent); }

    .studio {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 0;
      min-height: calc(100vh - 60px);
    }

    /* LEFT — PREVIEW */
    .preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      border-right: 1px solid #222;
      background: #0f0f0f;
    }
    .preview-label {
      font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--mid); margin-bottom: 1.5rem;
    }
    canvas { border-radius: 50%; }
    .preview-hint {
      margin-top: 1.5rem; font-size: 0.8rem; color: var(--mid); text-align: center;
    }

    /* RIGHT — CONTROLS */
    .controls {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      overflow-y: auto;
    }

    .control-group h3 {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--mid); margin-bottom: 0.75rem;
    }

    /* DESIGNS */
    .design-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }
    .design-btn {
      aspect-ratio: 1;
      background: var(--grey);
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: border-color 0.15s;
    }
    .design-btn:hover { border-color: #444; }
    .design-btn.active { border-color: var(--accent); }

    /* COLORS */
    .color-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .color-swatch {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .color-swatch.active { border-color: var(--white); }

    /* TEXT */
    .text-input {
      width: 100%;
      background: var(--grey);
      border: 1px solid #333;
      border-radius: 4px;
      color: var(--white);
      font-family: var(--font);
      font-size: 1rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .text-input:focus { border-color: var(--accent); }
    .text-hint { font-size: 0.75rem; color: var(--mid); margin-top: 0.4rem; }

    /* BUY */
    .buy-section { margin-top: auto; padding-top: 1rem; border-top: 1px solid #222; }
    .buy-summary {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .buy-summary span { font-size: 0.85rem; color: var(--mid); }
    .buy-summary strong { font-size: 1.4rem; font-weight: 900; }
    .btn-buy {
      display: block; width: 100%;
      background: var(--accent); color: #fff;
      padding: 1rem; font-size: 1rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer;
    }
    .btn-buy:hover { opacity: 0.85; }
    .shipping-note { font-size: 0.72rem; color: var(--mid); text-align: center; margin-top: 0.5rem; }

    @media (max-width: 720px) {
      .studio { grid-template-columns: 1fr; }
      .preview { border-right: none; border-bottom: 1px solid #222; padding: 2rem 1rem; }
      .controls { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">← Croc Spin Charm</a>
  <div class="price-tag">$4.99</div>
</nav>

<div class="studio">

  <!-- PREVIEW -->
  <div class="preview">
    <div class="preview-label">Live Preview</div>
    <canvas id="disc" width="280" height="280"></canvas>
    <div class="preview-hint">Spinning at actual scale — what you see is what you get.</div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <!-- DESIGNS -->
    <div class="control-group">
      <h3>Design</h3>
      <div class="design-grid">
        <button class="design-btn active" data-design="blank" title="Blank">⬜</button>
        <button class="design-btn" data-design="star" title="Star">⭐</button>
        <button class="design-btn" data-design="heart" title="Heart">❤️</button>
        <button class="design-btn" data-design="lightning" title="Lightning">⚡</button>
        <button class="design-btn" data-design="peace" title="Peace">☮️</button>
        <button class="design-btn" data-design="smile" title="Smiley">😊</button>
        <button class="design-btn" data-design="flame" title="Flame">🔥</button>
        <button class="design-btn" data-design="wave" title="Wave">🌊</button>
      </div>
    </div>

    <!-- COLORS -->
    <div class="control-group">
      <h3>Color</h3>
      <div class="color-row">
        <div class="color-swatch active" data-color="#f5f5f5" style="background:#f5f5f5" title="White"></div>
        <div class="color-swatch" data-color="#1a1aff" style="background:#1a1aff" title="Blue"></div>
        <div class="color-swatch" data-color="#ff4d00" style="background:#ff4d00" title="Orange"></div>
        <div class="color-swatch" data-color="#00cc44" style="background:#00cc44" title="Green"></div>
        <div class="color-swatch" data-color="#ffcc00" style="background:#ffcc00" title="Yellow"></div>
        <div class="color-swatch" data-color="#cc00cc" style="background:#cc00cc" title="Purple"></div>
      </div>
    </div>

    <!-- TEXT -->
    <div class="control-group">
      <h3>Text (optional)</h3>
      <input class="text-input" id="disc-text" type="text" maxlength="12" placeholder="Your word or phrase..." />
      <div class="text-hint">12 characters max — keeps it readable on a quarter-sized disc.</div>
    </div>

    <!-- BUY -->
    <div class="buy-section">
      <div class="buy-summary">
        <span>Custom spinner charm</span>
        <strong>$4.99</strong>
      </div>
      <button class="btn-buy" id="buy-btn">Add to Cart</button>
      <div class="shipping-note">+ shipping · Free over $25</div>
    </div>

  </div>
</div>

<script>
  const canvas = document.getElementById('disc');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, CX = W/2, CY = H/2;
  const DISC_R = 125, HOLE_R = 10;

  let angle = 0;
  let discColor = '#f5f5f5';
  let activeDesign = 'blank';
  let discText = '';

  // ── DRAW ──────────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(angle);

    // disc face
    ctx.beginPath();
    ctx.arc(0, 0, DISC_R, 0, Math.PI*2);
    ctx.fillStyle = discColor;
    ctx.fill();

    // subtle edge shading
    const grad = ctx.createRadialGradient(0, 0, DISC_R*0.6, 0, 0, DISC_R);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.beginPath();
    ctx.arc(0, 0, DISC_R, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();

    // design
    drawDesign(activeDesign);

    // text overlay
    if (discText) {
      ctx.save();
      const fs = discText.length > 8 ? 18 : discText.length > 5 ? 22 : 28;
      ctx.font = `900 ${fs}px 'Helvetica Neue', Helvetica, Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // contrast color
      ctx.fillStyle = isLight(discColor) ? '#111' : '#fff';
      ctx.fillText(discText.toUpperCase(), 0, activeDesign === 'blank' ? 0 : 50);
      ctx.restore();
    }

    // center hole
    ctx.beginPath();
    ctx.arc(0, 0, HOLE_R, 0, Math.PI*2);
    ctx.fillStyle = '#0a0a0a';
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  function isLight(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return (r*299 + g*587 + b*114) / 1000 > 128;
  }

  function drawDesign(design) {
    const fg = isLight(discColor) ? '#111' : '#fff';
    ctx.fillStyle = fg;
    ctx.strokeStyle = fg;

    if (design === 'star') {
      drawStar(0, 0, 5, 70, 30);
    } else if (design === 'heart') {
      drawHeart(0, -10, 60);
    } else if (design === 'lightning') {
      drawLightning();
    } else if (design === 'peace') {
      drawPeace(0, 0, 60);
    } else if (design === 'smile') {
      drawSmile(0, 0, 70);
    } else if (design === 'flame') {
      drawFlame(0, 10, 55);
    } else if (design === 'wave') {
      drawWave();
    }
  }

  function drawStar(cx, cy, pts, outerR, innerR) {
    ctx.beginPath();
    for (let i = 0; i < pts * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (i * Math.PI / pts) - Math.PI/2;
      i === 0 ? ctx.moveTo(cx + r*Math.cos(a), cy + r*Math.sin(a))
               : ctx.lineTo(cx + r*Math.cos(a), cy + r*Math.sin(a));
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawHeart(cx, cy, size) {
    const s = size / 60;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 20);
    ctx.bezierCurveTo(-60, -20, -60, -70, 0, -40);
    ctx.bezierCurveTo(60, -70, 60, -20, 0, 20);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawLightning() {
    ctx.beginPath();
    ctx.moveTo(15, -70);
    ctx.lineTo(-10, 0);
    ctx.lineTo(10, 0);
    ctx.lineTo(-15, 70);
    ctx.lineTo(30, -15);
    ctx.lineTo(10, -15);
    ctx.lineTo(35, -70);
    ctx.closePath();
    ctx.fill();
  }

  function drawPeace(cx, cy, r) {
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx, cy + r);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx - r * Math.cos(Math.PI/6), cy + r * Math.sin(Math.PI/6));
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(Math.PI/6), cy + r * Math.sin(Math.PI/6));
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawSmile(cx, cy, r) {
    ctx.lineWidth = 7;
    // face outline
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    // eyes
    ctx.beginPath();
    ctx.arc(cx - 22, cy - 20, 7, 0, Math.PI*2); ctx.fill();
    ctx.arc(cx + 22, cy - 20, 7, 0, Math.PI*2); ctx.fill();
    // smile
    ctx.beginPath();
    ctx.arc(cx, cy + 10, 35, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawFlame(cx, cy, h) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + h);
    ctx.bezierCurveTo(cx - 30, cy + h*0.4, cx - 35, cy - h*0.1, cx - 10, cy - h*0.4);
    ctx.bezierCurveTo(cx - 15, cy - h*0.6, cx - 5, cy - h*0.85, cx, cy - h);
    ctx.bezierCurveTo(cx + 5, cy - h*0.85, cx + 15, cy - h*0.6, cx + 10, cy - h*0.4);
    ctx.bezierCurveTo(cx + 35, cy - h*0.1, cx + 30, cy + h*0.4, cx, cy + h);
    ctx.closePath();
    ctx.fill();
  }

  function drawWave() {
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-90, -15);
    ctx.bezierCurveTo(-55, -50, -35, 20, 0, -15);
    ctx.bezierCurveTo(35, -50, 55, 20, 90, -15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-90, 20);
    ctx.bezierCurveTo(-55, -15, -35, 55, 0, 20);
    ctx.bezierCurveTo(35, -15, 55, 55, 90, 20);
    ctx.stroke();
    ctx.lineWidth = 1; ctx.lineCap = 'butt';
  }

  // ── ANIMATE ───────────────────────────────────────────────────────
  function loop() {
    angle += 0.018;
    draw();
    requestAnimationFrame(loop);
  }
  loop();

  // ── CONTROLS ──────────────────────────────────────────────────────
  document.querySelectorAll('.design-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.design-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeDesign = btn.dataset.design;
    });
  });

  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      discColor = sw.dataset.color;
    });
  });

  document.getElementById('disc-text').addEventListener('input', e => {
    discText = e.target.value;
  });

  document.getElementById('buy-btn').addEventListener('click', () => {
    // Stripe checkout wires in here
    alert('Stripe checkout coming soon!');
  });
</script>

</body>
</html>
